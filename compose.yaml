services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run scripts/compose-up.sh}
      FEED_DB_PASSWORD: ${FEED_DB_PASSWORD:?}
      INTERACTION_DB_PASSWORD: ${INTERACTION_DB_PASSWORD:?}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db:/schema:ro
      - ./scripts/init-mysql.sh:/docker-entrypoint-initdb.d/10-frameflow.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h127.0.0.1 -uroot -Nse 'SELECT 1 FROM frameflow_proto_feed.videos LIMIT 1'"]
      interval: 4s
      timeout: 3s
      retries: 35
  redis:
    image: redis:7.2-alpine
  interaction:
    build: {context: ., target: interaction}
    environment:
      INTERACTION_LISTEN: "0.0.0.0:9091"
      INTERACTION_DSN: "ff_interaction:${INTERACTION_DB_PASSWORD}@tcp(mysql:3306)/frameflow_proto_interaction"
    depends_on:
      mysql: {condition: service_healthy}
  feed:
    build: {context: ., target: feed}
    environment:
      GIN_MODE: release
      LISTEN_ADDR: "0.0.0.0:8080"
      INTERACTION_ADDR: interaction:9091
      FEED_DSN: "ff_feed:${FEED_DB_PASSWORD}@tcp(mysql:3306)/frameflow_proto_feed"
      REDIS_ADDR: redis:6379
      PLAY_SECRET: ${PLAY_SECRET:?}
    ports: ["127.0.0.1:8080:8080"]
    volumes: [uploads:/app/data/uploads]
    depends_on:
      mysql: {condition: service_healthy}
      interaction: {condition: service_started}
      redis: {condition: service_started}
volumes:
  mysql-data:
  uploads:
